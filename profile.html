<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCats Club — Мой Профиль</title>
    <link rel="icon" type="image/png" href="https://icons8.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img class="logo" src="https://icons8.com" alt="Logo">
        <span class="brand">DevCats</span>
    </header>

    <nav class="nav">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="form.html" class="nav-link">Анкета</a>
        <a href="profile.html" class="nav-link active">Профиль</a>
    </nav>

    <main class="main-content">
        <div class="card profile-card">
            <div class="avatar-container">
                <img class="avatar" src="https://unsplash.com" alt="User avatar">
                <span class="badge">Senior Meow</span>
            </div>
            
            <h2>Навайбкодил_3000</h2>
            <p class="email-info">cat@code.me</p>

            <div class="profile-data">
                <p><strong>Ночной кофе:</strong> 3 чашки</p>
                <p><strong>Стаж вайба:</strong> с 2024 года</p>
                <p><strong>Любимый стек:</strong> HTML / CSS по красоте</p>
            </div>

            <!-- Блок с изменением пароля -->
            <div class="password-change-block">
                <h3>Безопасность профиля</h3>
                <form class="club-form" onsubmit="alert('Пароль успешно изменен!'); return false;">
                    <div class="form-group">
                        <label>Старый пароль:</label>
                        <input type="password" placeholder="Введите старый пароль" required>
                    </div>
                    <div class="form-group">
                        <label>Новый пароль:</label>
                        <input type="password" placeholder="Введите новый пароль" required>
                    </div>
                    <div class="form-group">
                        <label>Повторите новый пароль:</label>
                        <input type="password" placeholder="Повторите еще раз" required>
                    </div>
                    <button type="submit" class="btn btn-secure">Обновить пароль</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <img class="footer-logo" src="https://icons8.com" alt="Logo">
        <div class="footer-nav">
            <a href="index.html">Главная</a> | <a href="form.html">Анкета</a> | <a href="profile.html">Профиль</a>
        </div>
        <p class="contacts">TG: @devcats_club | Ночной вайб © 2026</p>
    </footer>
</body>
</html>
