<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroClub — Анкета</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <a href="index.html" class="logo">
        <img src="logo.svg" alt="Логотип">
        <span>AstroClub</span>
      </a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="form.html" class="active">Анкета</a>
        <a href="profile.html">Профиль</a>
      </nav>
    </header>

    <main>
      <h1>Анкета участника</h1>
      <p>Заполни, чтобы мы могли построить твою натальную карту 💫</p>

      <form action="#" method="post">

        <div class="field">
          <label for="name">Имя и фамилия</label>
          <input type="text" id="name" name="name" placeholder="Мария Иванова" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="Минимум 6 символов" minlength="6" required>
        </div>

        <div class="field">
          <label for="birthdate">Дата рождения</label>
          <input type="date" id="birthdate" name="birthdate" required>
        </div>

        <div class="field">
          <label for="birthtime">Время рождения</label>
          <input type="time" id="birthtime" name="birthtime" required>
        </div>

        <div class="field">
          <label for="birthplace">Место рождения</label>
          <input type="text" id="birthplace" name="birthplace" placeholder="г. Симферополь" required>
        </div>

        <div class="field">
          <label for="luckynum">Счастливое число</label>
          <input type="number" id="luckynum" name="luckynum" min="1" max="99" value="7">
        </div>

        <div class="field">
          <label>Пол</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="female" checked> Женский</label>
            <label><input type="radio" name="gender" value="male"> Мужской</label>
            <label><input type="radio" name="gender" value="other"> Другое</label>
          </div>
        </div>

        <div class="field">
          <label for="zodiac">Знак зодиака</label>
          <select id="zodiac" name="zodiac">
            <option value="">— выбери —</option>
            <option>Овен</option><option>Телец</option><option>Близнецы</option>
            <option>Рак</option><option>Лев</option><option>Дева</option>
            <option>Весы</option><option>Скорпион</option><option>Стрелец</option>
            <option>Козерог</option><option>Водолей</option><option>Рыбы</option>
          </select>
        </div>

        <div class="field">
          <label for="about">Немного о себе</label>
          <textarea id="about" name="about" placeholder="Почему ты хочешь в клуб? Что тебя привлекает в астрологии?"></textarea>
        </div>

        <div class="field">
          <div class="check-group">
            <label>
              <input type="checkbox" name="agree" required>
              Согласен(а) на обработку персональных данных
            </label>
          </div>
        </div>

        <div class="buttons">
          <button type="submit">Отправить</button>
          <button type="reset">Сбросить</button>
        </div>

      </form>
    </main>

    <footer class="footer">
      <div class="footer-logo">
        <img src="logo.svg" alt="Лого">
        <span>AstroClub</span>
      </div>
      <nav>
        <a href="index.html">Главная</a>
        <a href="form.html">Анкета</a>
        <a href="profile.html">Профиль</a>
      </nav>
      <p>📧 info@astroclub.ru<br>📞 +7 (900) 123-45-67</p>
      <p class="copy">© 2026 AstroClub</p>
    </footer>

  </div>
</body>
</html>
